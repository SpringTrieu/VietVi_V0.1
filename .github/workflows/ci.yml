name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vietvi
          POSTGRES_PASSWORD: vietvi_dev_secret
          POSTGRES_DB: vietvi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Format check
        run: |
          pnpm lint
          pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit test
        run: pnpm test

      # TODO: Bật lại sau Sprint 1 khi đã có openapi.json và endpoint API hoàn chỉnh
      - name: Kiểm tra hợp đồng API (Contract verification)
        continue-on-error: true
        run: |
          pnpm gen
          git diff --exit-code docs/api/openapi.json || (echo "Hợp đồng API đã thay đổi nhưng chưa cập nhật docs/api/openapi.json" && exit 1)

      # TODO: Bật lại sau Sprint 1 khi hoàn thiện bộ test database
      - name: Kiểm tra migration trên database trống
        continue-on-error: true
        env:
          DATABASE_URL: postgres://vietvi:vietvi_dev_secret@localhost:5432/vietvi_test?sslmode=disable
        run: |
          pnpm db:migrate
          git diff --exit-code apps/api/db/schema.sql || (echo "Schema.sql lệch so với migration" && exit 1)

      - name: Build monorepo
        run: pnpm build
