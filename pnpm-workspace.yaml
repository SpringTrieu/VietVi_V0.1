packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Runtime & Language
  typescript: ^6.0.3

  # Front-end
  next: ^16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  "@tailwindcss/turbopack": ^4.3.3
  "@tanstack/react-query": "*"
  zustand: "*"
  "react-hook-form": "*"
  zod: ^4.6.7
  next-intl: "*"
  socket.io-client: "*"
  msw: "*"
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  "@radix-ui/react-slot": ^1.5.0
  lucide-react: ^1.63.0

  # Back-end
  "@nestjs/core": ^11.2.8
  "@nestjs/common": ^11.2.8
  "@nestjs/platform-express": ^11.2.8
  "@nestjs/config": "*"
  "@nestjs/jwt": "*"
  "@nestjs/swagger": "*"
  "@nestjs/websockets": ^11.2.8
  "@nestjs/platform-socket.io": ^11.2.8
  kysely: ^0.29.7
  pg: "*"
  bullmq: ^6.5.1
  nestjs-pino: "*"
  pino: "*"
  socket.io: "*"

  # Shared
  "@hookform/resolvers": "*"
  orval: "*"

  # Dev tools
  turbo: ^2.11.10
  prettier: ^3.9.10
  eslint: ^9.39.5
  typescript-eslint: ^8.33.0
  "@eslint/js": ^9.27.0
  eslint-plugin-boundaries: ^7.4.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
  dbmate: ^2.37.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  vitest: "*"
  "@testing-library/react": "*"
  jest: "*"
  supertest: "*"
  playwright: "*"

  # Types
  "@types/node": "*"
  "@types/react": "*"
  "@types/react-dom": "*"
  "@types/express": "*"
  "@types/jest": "*"
  "@types/supertest": "*"
  "@types/pg": "*"

  # NestJS runtime & dev tools
  reflect-metadata: "*"
  rxjs: "*"
  "@nestjs/cli": ^11.0.0
  "@nestjs/schematics": ^11.0.0
  "@nestjs/testing": ^11.2.8
  ts-jest: "*"
  ts-loader: "*"
  ts-node: "*"
  tsconfig-paths: "*"
  source-map-support: "*"

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.63.0
